[tool.poetry]
name = "vitap-vtop-client"
version = "0.5.1"
description = "A Pythonic interface to interact with the VIT-AP VTOP student portal."
authors = ["Udhay Adithya udhayxd@gamil.com"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Udhay-Adithya/vitap-vtop-client"
repository = "https://github.com/Udhay-Adithya/vitap-vtop-client"
keywords = ["VIT-AP", "VTOP", "student portal", "API", "Python"]
packages = [{ include = "vitap_vtop_client" }]
# The bundled CA cert is package data and must ship in the wheel and sdist.
include = [{ path = "vitap_vtop_client/certs/*.pem", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.13.3"
httpx = "^0.28.1"
pydantic = "^2.11.5"
bs4 = "0.0.2"
lxml = "5.4.0"
Pillow = "11.2.1"
numpy = "2.2.6"
pandas = "2.2.3"
python-dotenv = "1.1.0"
certifi = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.24.0"


[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
furo = "^2025.12.19"
sphinx-copybutton = "^0.5.2"
sphinx-autodoc-typehints = "^3.13.6"
myst-parser = "^5.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real VTOP portal. Needs credentials and a human for the OTP. Deselected by default.",
]
# Live tests are opt in, so a plain `pytest` run stays offline and secretless.
addopts = "-m 'not live'"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
