name: docs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with docs

      # -W turns warnings into errors, so a broken reference or a docstring
      # Sphinx cannot parse fails the build instead of shipping quietly.
      - name: Build docs
        run: poetry run sphinx-build -b html -W docs docs/_build/html
