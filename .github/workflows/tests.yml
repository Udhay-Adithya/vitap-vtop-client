name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      # Live tests are excluded by the addopts in pyproject.toml, so this job
      # never needs credentials or network access to VTOP.
      - name: Run offline tests
        run: poetry run pytest -v
