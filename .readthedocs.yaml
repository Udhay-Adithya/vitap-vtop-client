# Read the Docs build. The API reference is generated from docstrings, so the
# package and its runtime dependencies have to be installed for autodoc to
# import them.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      - pip install poetry
      - poetry config virtualenvs.create false
    post_install:
      - poetry install --with docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
